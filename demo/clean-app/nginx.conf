# Test fixture: Secure Nginx configuration with HSTS and TLS baselines
# Addresses IN-BP-003 and IN-DPDP-013. Not for production use.
server {
    listen 80;
    server_name example.test;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.test;

    ssl_certificate /etc/ssl/certs/example.test.crt;
    ssl_certificate_key /etc/ssl/private/example.test.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Enforce HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /var/www/clean-app;
        index index.html;
    }
}

