<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flawed Demo App - Sign Up</title>
  <!-- Planted flaw IN-BP-001 / IN-BP-004: Third-party Google Fonts link -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Planted flaw IN-BP-001 / IN-BP-004: Third-party analytics script loading on page load -->
  <script src="https://cdn.analytics.example.test/track.js"></script>
</head>
<body>
  <header>
    <h1>Flawed Demo Portal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </header>

  <main>
    <h2>Create Your Account</h2>
    <!-- Planted flaw IN-DPDP-002: Signup and consent screens have no link to any notice -->
    <!-- Planted flaw IN-DPDP-011: Signup has no date-of-birth or age field and no parental branch -->
    <form action="/register" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <!-- Planted flaw IN-DPDP-004: Single pre-ticked checkbox bundling marketing and analytics consent -->
      <div class="checkbox-group">
        <label for="bundled_consent">
          <input type="checkbox" id="bundled_consent" name="bundled_consent" checked>
          I agree to receive promotional marketing emails and allow analytics tracking of my browsing behavior across sessions.
        </label>
      </div>

      <button type="submit" class="btn-primary">Register</button>
    </form>
  </main>

  <!-- Planted flaw IN-DPDP-008: No contact details in footer or consent request -->
  <footer>
    <p>&copy; 2026 Flawed Demo App. All rights reserved.</p>
    <p><a href="nav/step1.html">Site Directory</a></p>
  </footer>
</body>
</html>
